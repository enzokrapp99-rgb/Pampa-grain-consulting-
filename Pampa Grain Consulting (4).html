<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pampa Grain Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1D19;--bg2:#132620;--surface:#182F27;--surface2:#1D382F;
  --line:rgba(239,230,210,.12);--line2:rgba(239,230,210,.22);
  --gold:#D2A23A;--gold-soft:#E8C77A;--navy:#24456B;--navy-soft:#8DB0D6;
  --text:#EFE6D2;--muted:#A9B8AE;--green:#4C8C66;--red:#D98466;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto}
.sec{padding:100px 0;border-top:1px solid var(--line)}
.sec.alt{background:var(--bg2)}
.sec.first{padding-top:150px;border-top:0}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;letter-spacing:-.015em;line-height:1.08;margin:0}
h2{font-size:clamp(2.1rem,4.6vw,3.4rem);max-width:17ch}
h3{font-size:1.4rem;font-weight:500}
h4{font-size:1.1rem;font-weight:500}
p{margin:0}
.lede{color:var(--muted);font-size:1.1rem;max-width:60ch}
.head{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:end;margin-bottom:56px}
.small-note{font-size:.82rem;color:var(--muted);margin-top:14px}
@media(max-width:860px){.head{grid-template-columns:1fr;gap:18px;margin-bottom:38px}.sec{padding:76px 0}.sec.first{padding-top:120px}}

/* nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:60;padding-top:env(safe-area-inset-top,0px);background:rgba(15,29,25,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:70px;gap:16px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;flex-shrink:0}
.brand-txt{line-height:1}
.brand-txt b{display:block;font-family:var(--serif);font-weight:500;font-size:1.15rem}
.brand-txt small{display:block;font-size:.64rem;color:var(--gold);letter-spacing:.34em;margin-top:4px}
.links{display:flex;gap:18px;font-size:.88rem}
.links a{text-decoration:none;color:var(--muted);padding:4px 0;border-bottom:1px solid transparent;transition:color .2s}
.links a:hover{color:var(--text)}
.links a.on{color:var(--text);border-bottom-color:var(--gold)}
.actions{display:flex;gap:10px;align-items:center}
.langs{display:flex;border:1px solid var(--line2);border-radius:999px;padding:3px}
.langs button{background:none;border:0;color:var(--muted);font:600 .76rem var(--sans);padding:6px 10px;border-radius:999px;cursor:pointer;letter-spacing:.04em}
.langs button.on{background:var(--gold);color:#1B1505}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--gold);color:#1B1505;border:0;border-radius:999px;padding:13px 24px;font:600 .95rem var(--sans);text-decoration:none;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--gold-soft)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line2)}
.btn.ghost:hover{border-color:var(--gold);background:rgba(210,162,58,.08)}
.btn.sm{padding:9px 18px;font-size:.86rem}
.btn:disabled{opacity:.6;cursor:wait}
.menu-btn{display:none;background:none;border:1px solid var(--line2);color:var(--text);border-radius:10px;width:40px;height:38px;cursor:pointer;align-items:center;justify-content:center}
@media(max-width:1280px){
  .links{display:none}.menu-btn{display:inline-flex}
  .links.open{display:flex;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--bg2);padding:20px 24px 26px;border-bottom:1px solid var(--line);gap:14px;font-size:1.05rem;max-height:calc(100svh - 80px);overflow-y:auto}
}
@media(max-width:600px){.actions .btn{display:none}.brand-txt small{display:none}}

/* hero */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:150px 0 0;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(1000px 520px at 22% 60%,rgba(36,69,107,.35),transparent 70%),radial-gradient(700px 400px at 85% 20%,rgba(210,162,58,.10),transparent 70%);pointer-events:none}
.hero-map{position:absolute;left:50%;transform:translateX(-50%);bottom:40px;width:max(1300px,120%);pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 30%,#000 80%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 30%,#000 80%,transparent 100%)}
.hero-copy{position:relative;z-index:2}
.hero h1{font-size:clamp(2.8rem,7.4vw,6.2rem);font-weight:300;line-height:.98;max-width:12ch;letter-spacing:-.03em}
.hero .lede{margin-top:28px;font-size:1.18rem;color:#C9D3CC}
.ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:36px}
.facts{position:relative;z-index:2;margin-top:auto;padding-top:90px}
.facts-row{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line2);background:linear-gradient(to bottom,rgba(15,29,25,.4),rgba(15,29,25,.92))}
.fact{padding:22px 20px 30px 0}
.fact+.fact{padding-left:22px;border-left:1px solid var(--line)}
.fact strong{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(1.6rem,3vw,2.3rem);color:var(--gold-soft);line-height:1.1}
.fact span{font-size:.88rem;color:var(--muted)}
@media(max-width:760px){.facts-row{grid-template-columns:1fr 1fr}.fact:nth-child(3){padding-left:0;border-left:0}.fact{border-top:1px solid var(--line)}.fact:nth-child(-n+2){border-top:0}}

/* ticker */
.ticker-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ticker-head h3{font-size:1.6rem}
.ticker-head span{color:var(--muted);font-size:.9rem}
.ticker{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.tk{background:var(--bg);padding:20px 20px 22px}
.tk .nm{color:var(--muted);font-size:.9rem}
.tk .px{font-family:var(--serif);font-size:1.7rem;line-height:1.2;margin-top:4px}
.tk .usd{font-size:.9rem;color:var(--muted)}
@media(max-width:900px){.ticker{grid-template-columns:1fr 1fr}}
.chg{display:inline-block;font:600 .76rem var(--sans);padding:3px 9px;border-radius:999px;margin-left:8px;vertical-align:middle;white-space:nowrap}
.chg.up{background:rgba(76,140,102,.22);color:#8FD1A8}
.chg.down{background:rgba(217,132,102,.18);color:#F0AA90}
.chg.flat{background:rgba(239,230,210,.1);color:var(--muted)}
.link{color:var(--gold-soft);text-decoration:none;font-weight:600;font-size:.95rem}
.link:hover{text-decoration:underline}

/* rows list (home services) */
.rowlist{border-top:1px solid var(--line2)}
.rowlist a{display:grid;grid-template-columns:1fr 1.4fr auto;gap:24px;align-items:center;padding:24px 0;border-bottom:1px solid var(--line);text-decoration:none;transition:padding .25s,background .25s}
.rowlist a:hover{padding-left:12px;background:rgba(210,162,58,.04)}
.rowlist h3{font-size:1.45rem}
.rowlist p{color:var(--muted);font-size:.96rem}
.rowlist .arr{color:var(--gold);font-size:1.3rem}
@media(max-width:760px){.rowlist a{grid-template-columns:1fr auto}.rowlist p{grid-column:1/-1;grid-row:2}}

.band{display:grid;grid-template-columns:1.4fr auto;gap:30px;align-items:center;padding:44px;border-radius:26px;background:linear-gradient(140deg,#1F3B5C,#1E4A35)}
.band h2{font-size:clamp(1.8rem,3.6vw,2.6rem);max-width:20ch}
.band p{color:#D3DBD5;margin-top:10px;max-width:52ch}
@media(max-width:760px){.band{grid-template-columns:1fr;padding:30px 24px}}

/* map */
.land{stroke:#3B5A4E;stroke-width:2.5;stroke-linecap:round;fill:none}
.arc{fill:none;stroke:var(--gold);stroke-width:1.4;stroke-linecap:round;opacity:.85;transition:opacity .3s,stroke-width .3s}
.origin-dot{fill:var(--gold-soft)}
.origin-pulse{fill:none;stroke:var(--gold);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(2.6);opacity:0}}
.dest-dot{fill:var(--navy-soft)}
.dest-label{font:500 11px var(--sans);fill:var(--muted)}
.hero-map .dest-label{display:none}
.dest-wrap{display:grid;grid-template-columns:1fr 330px;gap:28px}
.map-box{background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:18px;overflow-x:auto}
.map-box svg{display:block;width:100%;min-width:640px;height:auto}
.dest{cursor:pointer}
.dest .halo{fill:var(--navy-soft);opacity:0;transition:opacity .25s}
.dest:hover .halo,.dest.on .halo{opacity:.25}
.dest.on .dest-dot{fill:var(--gold-soft)}
.dest.on .dest-label{fill:var(--text);font-weight:600}
.dest:focus{outline:none}.dest:focus-visible .halo{opacity:.45}
.map-i.sel .arc{opacity:.15}
.map-i.sel .arc.on{opacity:1;stroke-width:2.4;stroke:var(--gold-soft)}
.panel{background:var(--surface);border-radius:22px;padding:28px;display:flex;flex-direction:column}
.panel .rank{font-size:.85rem;color:var(--gold)}
.panel h3{font-size:2rem;margin:6px 0 4px}
.panel .region{color:var(--muted);font-size:.92rem;margin-bottom:18px}
.panel p{color:#D3DBD5}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tag{font-size:.78rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:24px}
.chip{background:none;border:1px solid var(--line2);color:var(--muted);border-radius:999px;padding:6px 12px;font:500 .82rem var(--sans);cursor:pointer}
.chip.on,.chip:hover{border-color:var(--gold);color:var(--text)}
@media(max-width:980px){.dest-wrap{grid-template-columns:1fr}}

/* about */
.about-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:64px;align-items:start}
.about-text p+p{margin-top:18px}
.about-text p{color:#C9D3CC;font-size:1.08rem;max-width:56ch}
.mv{display:grid;gap:18px}
.mv article{padding:30px 30px 32px;border-radius:4px 22px 22px 22px}
.mv .m1{background:linear-gradient(140deg,#1E4A35,#173A2B)}
.mv .m2{background:linear-gradient(140deg,#1F3B5C,#172C46)}
.mv h3{margin-bottom:12px;color:var(--gold-soft)}
.mv p{color:#DCE3DD}
.goals{margin-top:72px;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line2)}
.goal{padding:24px 22px 8px 0}
.goal+.goal{padding-left:22px;border-left:1px solid var(--line)}
.goal h4{margin-bottom:8px}
.goal p{font-size:.93rem;color:var(--muted)}
@media(max-width:980px){.about-grid{grid-template-columns:1fr;gap:40px}.goals{grid-template-columns:1fr 1fr}.goal{padding-left:0!important;border-left:0!important;border-bottom:1px solid var(--line);padding-bottom:22px}}
@media(max-width:560px){.goals{grid-template-columns:1fr}}

/* services */
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.svc{background:var(--bg);padding:36px 32px 34px;display:flex;flex-direction:column;text-decoration:none;transition:background .3s}
.svc:hover{background:var(--surface)}
.ico{width:38px;height:38px;stroke:var(--gold);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-bottom:22px}
.svc h3{margin-bottom:10px}
.svc p{color:var(--muted);font-size:.97rem}
.svc .link{margin-top:auto;padding-top:22px}
@media(max-width:960px){.svc-grid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.svc-grid{grid-template-columns:1fr}}
.crumb{font-size:.9rem;color:var(--muted);margin-bottom:22px}
.crumb a{color:var(--gold-soft);text-decoration:none}
.sd-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:56px;margin-top:56px}
.sd-grid h3{margin-bottom:16px}
.checks{list-style:none;padding:0;margin:0}
.checks li{padding:14px 0 14px 30px;border-top:1px solid var(--line);position:relative;color:#C9D3CC}
.checks li::before{content:"";position:absolute;left:2px;top:21px;width:12px;height:7px;border-left:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(-45deg)}
.example{background:linear-gradient(150deg,#1F3B5C,#172C46);border-radius:22px;padding:30px}
.example .lab{font-size:.85rem;color:var(--navy-soft);margin-bottom:10px}
.example p{color:#E2E8EE;font-size:1.05rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:20px}
.step{border-top:2px solid var(--gold);padding-top:16px}
.step b{font-family:var(--serif);font-size:1.6rem;color:var(--gold-soft);font-weight:400}
.step h4{margin:4px 0 6px}
.step p{color:var(--muted);font-size:.93rem}
@media(max-width:900px){.sd-grid{grid-template-columns:1fr;gap:40px}.steps{grid-template-columns:1fr 1fr}}

/* clients */
.clients{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line2)}
.client{padding:30px 28px 32px 0;border-bottom:1px solid var(--line)}
.client:not(:nth-child(3n+1)){padding-left:28px;border-left:1px solid var(--line)}
.client h4{font-size:1.3rem;margin-bottom:4px}
.client .sector{font-size:.82rem;color:var(--gold);margin-bottom:12px}
.client p{color:var(--muted);font-size:.95rem}
@media(max-width:900px){.clients{grid-template-columns:1fr 1fr}.client{padding-left:0!important;border-left:0!important;padding-right:20px}}
@media(max-width:560px){.clients{grid-template-columns:1fr}}

/* market */
.mkt-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:56px}
.stack{display:flex;height:64px;border-radius:14px;overflow:hidden;margin:18px 0 14px}
.stack div{height:100%;display:flex;align-items:flex-end;padding:8px 10px;font-size:.78rem;font-weight:600;color:#10201A;white-space:nowrap;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.total-line{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.total-line strong{font-family:var(--serif);font-weight:300;font-size:clamp(3.2rem,7vw,5rem);line-height:1;color:var(--gold-soft)}
.total-line span{color:var(--muted)}
.crops{margin-top:40px}
.crop{display:grid;grid-template-columns:1fr auto;gap:6px 18px;padding:20px 0;border-top:1px solid var(--line)}
.crop h4{font-size:1.25rem}
.crop .vol{font-family:var(--serif);font-size:1.4rem;text-align:right}
.crop p{grid-column:1/-1;color:var(--muted);font-size:.94rem}
.lists h3{margin-bottom:16px}
.lists ul{list-style:none;padding:0;margin:0 0 36px}
.lists li{padding:14px 0 14px 26px;border-top:1px solid var(--line);position:relative;color:#C9D3CC;font-size:.97rem}
.lists li::before{content:"";position:absolute;left:2px;top:22px;width:8px;height:8px;border-radius:50%;background:var(--green)}
.lists .risks li::before{background:var(--red)}
.lists li b{color:var(--text);font-weight:600}
@media(max-width:960px){.mkt-grid{grid-template-columns:1fr;gap:40px}}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--bg)}
table{width:100%;border-collapse:collapse;font-size:.96rem;min-width:520px}
th{font:500 .85rem var(--sans);color:var(--muted);text-align:left;padding:16px 18px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:16px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.gr{font-family:var(--serif);font-size:1.12rem}
.est{color:var(--muted);font-size:.8rem;margin-left:4px}
.price-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;align-items:start}
.price-grid h3{margin-bottom:16px}
.side{display:grid;gap:18px}
.card{background:var(--surface);border-radius:20px;padding:24px}
.card h4{margin-bottom:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:.95rem}
.kv span:first-child{color:var(--muted)}
.big{font-family:var(--serif);font-size:2.2rem;color:var(--gold-soft);line-height:1.1}
.srcs{list-style:none;padding:0;margin:0;display:grid;gap:8px;font-size:.9rem}
.srcs a{color:var(--gold-soft)}
@media(max-width:960px){.price-grid{grid-template-columns:1fr}}

/* admin */
.admin{margin-top:56px;border:1px dashed rgba(210,162,58,.5);border-radius:22px;padding:30px;background:rgba(210,162,58,.04)}
.admin h3{margin-bottom:6px}
.admin .sub{color:var(--muted);margin-bottom:22px;font-size:.95rem}
.admin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.admin table input{padding:9px 10px;font-size:.92rem;min-width:90px}
.admin .msg{margin-top:14px;font-size:.92rem}
@media(max-width:760px){.admin-grid{grid-template-columns:1fr 1fr}.admin{padding:22px 16px}}

/* calc */
.calc{display:grid;grid-template-columns:1fr 1.1fr;border:1px solid var(--line);border-radius:26px;overflow:hidden}
.calc-in{padding:36px;background:var(--surface)}
.calc-out{padding:36px;background:linear-gradient(160deg,#1A3350,#132539)}
.field{margin-bottom:18px}
.field label{display:block;font-size:.88rem;color:var(--muted);margin-bottom:7px}
.hint{font-size:.78rem;color:var(--muted);margin-top:5px;opacity:.9}
input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font:500 1rem var(--sans)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.out-l{color:#C5D3E2;font-size:.92rem;margin-bottom:4px}
.out-v{font-family:var(--serif);font-weight:300;font-size:clamp(2.2rem,4.4vw,3.2rem);line-height:1;color:var(--gold-soft)}
.out-v small{font-family:var(--sans);font-size:.9rem;color:var(--muted);margin-left:4px;font-weight:500}
.out-ars{color:#C5D3E2;margin-top:6px;font-size:.95rem}
.bar{display:flex;height:16px;border-radius:999px;overflow:hidden;margin:28px 0 10px;background:rgba(255,255,255,.08)}
.bar div{height:100%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.blegend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:#C5D3E2}
.blegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.steps-calc{margin-top:22px}
.sc{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid rgba(255,255,255,.1);font-size:.95rem}
.sc span:first-child{color:#C5D3E2}
.sc.res{font-weight:600;color:var(--text)}
.sc.res span:first-child{color:var(--text)}
.calc-note{font-size:.8rem;color:#9FB2C7;margin-top:18px}
@media(max-width:900px){.calc{grid-template-columns:1fr}.calc-in,.calc-out{padding:26px 20px}}
@media(max-width:420px){.two,.outs{grid-template-columns:1fr}}

/* team / org / offices */

.person .role{color:var(--gold);font-size:.92rem;font-weight:600;margin:6px 0 14px}

@media(max-width:900px){.team{grid-template-columns:1fr}}
.org{margin-top:80px}

.tree{display:flex;flex-direction:column;align-items:center}
.node{background:var(--surface2);border:1px solid var(--line2);border-radius:14px;padding:14px 20px;text-align:center;min-width:200px}

.branches{display:grid;grid-template-columns:1fr 2.4fr;gap:28px;width:100%;padding-top:28px;border-top:1px solid var(--line2)}
.branch{display:flex;flex-direction:column;align-items:center;position:relative}
.branch::before{content:"";position:absolute;top:-28px;left:50%;width:1px;height:28px;background:var(--line2)}
.offices-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%;padding-top:24px;border-top:1px solid var(--line2)}
.offices-row .node{position:relative}
.offices-row .node::before{content:"";position:absolute;top:-25px;left:50%;width:1px;height:24px;background:var(--line2)}
@media(max-width:860px){.branches{grid-template-columns:1fr;border-top:0;padding-top:0;gap:0}.branch::before{display:none}.branch{padding-top:28px}.offices-row{grid-template-columns:1fr 1fr;border-top:0}.offices-row .node::before{display:none}}
.offices{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:18px}
.office{background:var(--surface);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:6px}
.office.hq{grid-row:span 2;background:linear-gradient(160deg,#1E4A35,#132a20);justify-content:flex-end;min-height:320px;position:relative}
.office.hq .badge{position:absolute;top:24px;left:28px;font-size:.82rem;color:#1B1505;background:var(--gold);padding:4px 12px;border-radius:999px;font-weight:600}
.office h3{font-size:1.5rem}
.office.hq h3{font-size:2.4rem}
.addr{font-size:.96rem;display:flex;gap:8px;align-items:flex-start}
.addr svg{flex-shrink:0;margin-top:4px;stroke:var(--gold);fill:none;stroke-width:1.6}
.office .focus{color:var(--muted);font-size:.93rem;margin-top:6px}
@media(max-width:900px){.offices{grid-template-columns:1fr 1fr}.office.hq{grid-column:1/-1;grid-row:auto;min-height:240px}}
@media(max-width:560px){.offices{grid-template-columns:1fr}}

/* timeline */
.timeline{display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.timeline::before{content:"";position:absolute;top:21px;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--navy-soft))}
.phase{padding-right:26px;position:relative}
.phase .num{width:44px;height:44px;border-radius:50%;background:var(--bg2);border:2px solid var(--gold);display:grid;place-items:center;font:500 1.15rem var(--serif);color:var(--gold-soft);position:relative;z-index:1}
.phase .months{margin:22px 0 6px;font-size:.88rem;color:var(--gold)}
.phase h3{font-size:1.3rem;margin-bottom:16px}
.phase ul{list-style:none;padding:0;margin:0}
.phase li{color:var(--muted);font-size:.93rem;padding:9px 0;border-top:1px solid var(--line)}
@media(max-width:900px){.timeline{grid-template-columns:1fr;gap:34px;padding-left:64px}.timeline::before{top:0;bottom:0;left:21px;width:2px;height:auto;right:auto;background:linear-gradient(180deg,var(--gold),var(--navy-soft))}.phase .num{position:absolute;left:-64px;top:0}.phase .months{margin-top:8px}}

/* news */
.news{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.nw{background:var(--surface);border-radius:20px;padding:26px 26px 28px;display:flex;flex-direction:column;gap:10px}
.nw .meta{font-size:.82rem;color:var(--gold)}
.nw h3{font-size:1.3rem}
.nw p{color:var(--muted);font-size:.95rem}
.nw .link{margin-top:auto;padding-top:8px}
.nw.feat{grid-column:span 2;background:linear-gradient(150deg,#1E4A35,#173A2B)}
.nw.feat h3{font-size:1.9rem}
.nw.feat p{color:#D3DBD5;font-size:1.03rem}
@media(max-width:960px){.news{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.news{grid-template-columns:1fr}.nw.feat{grid-column:auto}}

/* glossary */
.gsearch{max-width:420px;margin-bottom:34px}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:0 48px}
.term{padding:20px 0;border-top:1px solid var(--line);break-inside:avoid}
.term h4{font-size:1.3rem;color:var(--gold-soft)}
.term .full{font-size:.85rem;color:var(--muted);margin:2px 0 8px}
.term p{color:#C9D3CC;font-size:.96rem}
.empty{color:var(--muted);padding:20px 0}
@media(max-width:800px){.gl{grid-template-columns:1fr}}

/* faq + form */
.fc{display:grid;grid-template-columns:1fr 1fr;gap:64px}
.faq details{border-top:1px solid var(--line)}
.faq details:last-child{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:22px 40px 22px 0;font:500 1.12rem var(--serif);position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";position:absolute;right:8px;top:30px;width:10px;height:10px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(45deg);transition:transform .25s}
.faq details[open] summary::after{transform:rotate(-135deg);top:34px}
.faq details p{color:var(--muted);padding:0 0 24px;max-width:58ch}
.form{background:var(--surface);border-radius:26px;padding:36px}
.form h3{margin-bottom:6px;font-size:1.8rem}
.form .sub{color:var(--muted);margin-bottom:26px}
.form .btn{width:100%;margin-top:6px}
.ok{display:none;margin-top:18px;padding:16px 18px;border-radius:14px;background:rgba(76,140,102,.18);border:1px solid rgba(143,209,168,.35);color:#CFEBD9;font-size:.95rem}
.ok.show{display:block}
.err{color:#F0AA90;font-size:.88rem;margin-top:10px;display:none}
.err.show{display:block}
.contact-meta{margin-top:28px;display:grid;gap:8px;color:var(--muted);font-size:.95rem}
.contact-meta a{color:var(--gold-soft);text-decoration:none}
@media(max-width:960px){.fc{grid-template-columns:1fr;gap:56px}.form{padding:26px 20px}}

footer{border-top:1px solid var(--line);padding:56px 0 40px;background:#0C1714}
.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px}

.foot ul{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.foot ul a{text-decoration:none}.foot ul a:hover{color:var(--text)}
.foot h4{font-size:1rem}
.legal{margin-top:44px;padding-top:22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
@media(max-width:800px){.foot{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){.origin-pulse{animation:none}*{transition:none!important}}

const GLOS=[
 ["A3 Mercados","",["Mercado argentino de futuros y opciones con sede en Rosario, surgido de la fusión de Matba Rofex y MAE. Allí se negocian coberturas de precio para granos.","Argentina's futures and options exchange, based in Rosario, formed by the merger of Matba Rofex and MAE. Grain prices are hedged there.","Mercado argentino de futuros e opções, com sede em Rosario, criado pela fusão de Matba Rofex e MAE. Ali se fazem coberturas de preço de grãos."]],
 ["CBOT","Chicago Board of Trade",["Mercado de futuros de Chicago, referencia internacional de precios para soja, maíz y trigo.","Chicago futures market. The world price benchmark for soybeans, corn and wheat.","Mercado de futuros de Chicago. É a referência mundial de preço para soja, milho e trigo."]],
 ["CFR","Cost and Freight",["El vendedor paga el flete marítimo hasta el puerto de destino, pero el riesgo pasa al comprador cuando la mercadería se carga en el buque.","The seller pays ocean freight to the destination port, but risk passes to the buyer once the goods are loaded on the vessel.","O vendedor paga o frete marítimo até o porto de destino, mas o risco passa ao comprador quando a mercadoria é carregada no navio."]],
 ["CIF","Cost, Insurance and Freight",["Similar a CFR, con la diferencia de que el vendedor también contrata el seguro de la mercadería durante el tránsito.","Same as CFR, but the seller also buys cargo insurance for the voyage.","Igual ao CFR, mas o vendedor também contrata o seguro da mercadoria durante a viagem."]],
 ["DEX","Derechos de exportación",["También denominados retenciones. Tributo que grava la exportación y se calcula sobre el valor FOB. En 2026 las alícuotas son: soja 24%, maíz y sorgo 8,5%, trigo y cebada 5,5%.","Also called retenciones. A tax calculated on the FOB value. In 2026 soybeans pay 24%, corn and sorghum 8.5%, wheat and barley 5.5%.","Também chamados de retenções. É um tributo calculado sobre o valor FOB. Em 2026 a soja paga 24%, milho e sorgo 8,5% e trigo e cevada 5,5%."]],
 ["Demurrage","",["Penalidad diaria que se abona al armador cuando el buque excede el tiempo pactado para la carga o descarga (laytime).","Daily penalty paid to the shipowner when the vessel waits longer than agreed to load or unload.","Multa diária paga ao armador quando o navio espera mais do que o combinado para carregar ou descarregar."]],
 ["DJVE","Declaración Jurada de Venta al Exterior",["Registro obligatorio de cada venta de granos al exterior (Ley 21.453). Fija la alícuota de derechos de exportación vigente a la fecha de su registro, siempre que el embarque se realice dentro del plazo previsto.","Mandatory registration of every grain export sale (Law 21,453). It locks in the export duty rate in force on the registration date, provided the goods ship within the set period.","Registro obrigatório de cada venda de grãos ao exterior (Lei 21.453). Fixa a alíquota de direito de exportação vigente na data do registro, desde que o embarque ocorra dentro do prazo previsto."]],
 ["FAS","Free Alongside Ship",["Mercadería puesta al costado del buque. En granos, el FAS teórico surge de deducir del FOB los derechos de exportación y los gastos de embarque, y representa la capacidad de pago del exportador.","Goods placed alongside the vessel. In grains, theoretical FAS is FOB minus export duties and loading costs: what the exporter can afford to pay.","Mercadoria colocada ao lado do navio. Em grãos, o FAS teórico é o FOB menos os direitos de exportação e os gastos de embarque: o que o exportador pode pagar."]],
 ["FOB","Free On Board",["El vendedor entrega la mercadería cargada a bordo del buque en el puerto de embarque convenido. A partir de ese momento, el flete y los riesgos corren por cuenta del comprador.","The seller delivers the goods loaded on board at the port of shipment. From then on, freight and risk are the buyer's.","O vendedor entrega a mercadoria carregada a bordo no porto de embarque. A partir daí, frete e risco são do comprador."]],
 ["Fobbing","",["Gastos de traslado del grano desde el camión hasta la bodega del buque: recepción, elevación, uso de terminal y comisiones.","Costs of moving grain from the truck into the ship's hold: receiving, elevation, terminal use and fees.","Gastos de levar o grão do caminhão ao porão do navio: recepção, elevação, uso do terminal e comissões."]],
 ["Gran Rosario","",["Complejo portuario ubicado sobre el río Paraná, en el sur de la provincia de Santa Fe; uno de los principales nodos agroexportadores del mundo.","Port complex on the Paraná River in southern Santa Fe. One of the world's main agri-export hubs.","Complexo portuário no rio Paraná, no sul de Santa Fe. É um dos principais polos agroexportadores do mundo."]],
 ["Harina proteica","",["Subproducto de la molienda de soja o girasol destinado a la alimentación animal. La Argentina es uno de los principales exportadores mundiales de harina de soja.","By-product of crushing soybeans or sunflower, used as animal feed. Argentina is one of the largest soybean meal exporters.","Subproduto do esmagamento de soja ou girassol usado na alimentação animal. A Argentina é um dos maiores exportadores de farelo de soja."]],
 ["Incoterms","",["Reglas de la Cámara de Comercio Internacional (CCI) que delimitan los costos y riesgos a cargo del vendedor y del comprador.","International Chamber of Commerce rules defining which costs and risks the seller and the buyer each take on.","Regras da Câmara de Comércio Internacional que definem quais custos e riscos cabem ao vendedor e quais ao comprador."]],
 ["Liquidación de divisas","",["Ingreso y negociación en el mercado de cambios de las divisas que percibe el exportador por sus ventas al exterior.","Bringing in and selling, on the FX market, the dollars the exporter receives from foreign sales.","Ingresso e venda no mercado de câmbio dos dólares que o exportador recebe por suas vendas ao exterior."]],
 ["Originación","",["Adquisición de granos directamente a productores o acopiadores para su posterior exportación o industrialización.","Buying grain directly from farmers or elevators to later export or process it.","Compra de grãos diretamente de produtores ou armazéns para depois exportá-los ou industrializá-los."]],
 ["Panamax","",["Buque de las dimensiones máximas admitidas por el antiguo Canal de Panamá. En graneles agrícolas carga alrededor de 60.000 t.","Vessel of the maximum size that fit the old Panama Canal. In grains it loads around 60,000 t.","Navio do tamanho máximo que passava pelo antigo Canal do Panamá. Em grãos carrega cerca de 60.000 t."]],
 ["Permiso de embarque","",["Destinación de exportación oficializada ante la Dirección General de Aduanas (ARCA) que autoriza la salida de la mercadería del territorio aduanero.","Export entry filed with Customs (ARCA) that authorizes the goods to leave the country.","Destinação de exportação registrada na Aduana (ARCA) que autoriza a saída da mercadoria do país."]],
 ["Pizarra","Precio de pizarra",["Precio de referencia diario que publica una Cámara Arbitral de Cereales (por ejemplo, la de Rosario) para mercadería disponible con pago contado.","Daily reference price published by a grain arbitration chamber (for example, Rosario) for spot delivery and cash payment.","Preço de referência diário publicado por uma Câmara Arbitral de Cereais (por exemplo, Rosario) para mercadoria disponível e pagamento à vista."]],
 ["Prima","",["Diferencial entre el precio FOB en un puerto determinado y el precio de los futuros de Chicago. Puede ser positiva o negativa.","Difference between the FOB price at a port and the Chicago futures price. It can be positive or negative.","Diferença entre o preço FOB em um porto e o preço futuro de Chicago. Pode ser positiva ou negativa."]],
 ["Saldo exportable","",["Volumen disponible para exportación una vez cubiertos el consumo interno, la semilla y los stocks de reserva.","What is left to export after covering domestic use, seed and stocks.","O que sobra para exportar depois de cobrir o consumo interno, a semente e os estoques."]],
 ["Zona núcleo","",["Región agrícola de mayor productividad del país: sur de Santa Fe, sudeste de Córdoba y norte de Buenos Aires.","Argentina's most productive farming region: southern Santa Fe, southeastern Córdoba and northern Buenos Aires.","Região agrícola mais produtiva do país: sul de Santa Fe, sudeste de Córdoba e norte de Buenos Aires."]]
];

const W=1000,H=389,P=(lo,la)=>[(lo+180)/360*W,(80-la)/140*H];
function inside(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
let DOTS="";for(let la=78;la>=-56;la-=2.5)for(let lo=-178;lo<=180;lo+=2.5)if(LAND.some(p=>inside(lo,la,p))){const[a,b]=P(lo,la);DOTS+=`M${a.toFixed(1)} ${b.toFixed(1)}h0`;}
const ORIGIN=[-60.6,-33],NS="http://www.w3.org/2000/svg";
const mk=(tg,a)=>{const e=document.createElementNS(NS,tg);for(const k in a)e.setAttribute(k,a[k]);return e;};
function arcD(a,b){const[x0,y0]=P(...a),[x1,y1]=P(...b),d=Math.hypot(x1-x0,y1-y0);return`M${x0.toFixed(1)} ${y0.toFixed(1)}Q${((x0+x1)/2).toFixed(1)} ${(Math.min(y0,y1)-d*.32).toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)}`;}
let curDest="vn";
function buildMap(svg,interactive){
  svg.appendChild(mk("path",{d:DOTS,class:"land"}));
  const arcs={},groups={};

  const[ox,oy]=P(...ORIGIN);
  svg.appendChild(mk("circle",{cx:ox,cy:oy,r:6,class:"origin-pulse"}));
  svg.appendChild(mk("circle",{cx:ox,cy:oy,r:4.5,class:"origin-dot"}));
  D.forEach(d=>{const[px,py]=P(...d.ll),g=mk("g",{class:"dest"});
    g.appendChild(mk("circle",{cx:px,cy:py,r:14,class:"halo"}));g.appendChild(mk("circle",{cx:px,cy:py,r:4,class:"dest-dot"}));
    const left=d.k==="pe"||d.k==="br",tx=mk("text",{x:left?px-9:px+9,y:py+4,class:"dest-label","text-anchor":left?"end":"start"});tx.textContent=x(d.n);g.appendChild(tx);

}
let DM=null;

  [["¿Cómo se inicia el trabajo en conjunto?","How do we start working together?","Como começamos a trabalhar juntos?"],["Complete el formulario con su consulta. Coordinaremos una reunión inicial para relevar su volumen, sus productos y sus objetivos, y luego le presentaremos una propuesta de trabajo.","Fill in the form with your enquiry. We'll set up a first meeting to understand your volume, crops and goals, and then propose a work plan.","Preencha o formulário com sua consulta. Marcamos uma primeira reunião para entender seu volume, seus grãos e seus objetivos e propomos um plano de trabalho."]]];
 const types=[["Productor","Producer","Produtor"],["Cooperativa","Cooperative","Cooperativa"],["Exportador","Exporter","Exportador"],["Importador","Importer","Importador"],["Otro","Other","Outro"]];
 return `<section class="sec first"><div class="wrap fc">

let CS=null;
function hookCalc(){
  const $=id=>document.getElementById(id);
  const ids=["cFob","cDex","cFb","cFl","cCo","cTc","cT"];
  if(!CS)CS={g:"maiz",fb:FOBBING,fl:20,co:2,t:1000};
  $("cG").value=CS.g;
  function loadRef(){const g=PR.grains[$("cG").value];$("cFob").value=g.fob||0;$("cDex").value=g.dex||0;}
  function setDefaults(){$("cFb").value=CS.fb;$("cFl").value=CS.fl;$("cCo").value=CS.co;$("cTc").value=PR.tc;$("cT").value=CS.t;}
  const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)&&n>0?n:0;};
  function compute(fob,dex,fb,fl,co){const dx=fob*dex/100,fas=Math.max(fob-dx-fb,0),cm=fas*co/100,ch=Math.max(fas-fl-cm,0);return{dx,fas,cm,ch};}
  function calc(){
    const fob=num($("cFob").value),dex=Math.min(num($("cDex").value),100),fb=num($("cFb").value),fl=num($("cFl").value),co=Math.min(num($("cCo").value),50),tc=num($("cTc").value),tn=num($("cT").value);
    CS={g:$("cG").value,fb,fl,co,t:tn};
    const r=compute(fob,dex,fb,fl,co);
    $("oFas").textContent=fmt(r.fas,2);$("oCh").textContent=fmt(r.ch,2);
    $("oFasA").textContent=tc?"$ "+fmt(r.fas*tc)+" /t":"";$("oChA").textContent=tc?"$ "+fmt(r.ch*tc)+" /t":"";
    const pc=v=>fob>0?Math.max(0,v/fob*100):0;
    $("b1").style.width=pc(r.ch)+"%";$("b2").style.width=pc(Math.min(fl+r.cm,r.fas))+"%";$("b3").style.width=pc(Math.min(fb,fob-r.dx))+"%";$("b4").style.width=pc(r.dx)+"%";
    const U=v=>"US$ "+fmt(v,2);
    $("oSteps").innerHTML=[
      [t("Precio FOB","FOB price","Preço FOB"),U(fob)],
      [t("− Derecho de exportación","− Export duty","− Direito de exportação")+` (${fmt(dex,1)}%)`,"− "+U(r.dx)],
      [t("− Gastos de embarque","− Loading costs","− Gastos de embarque"),"− "+U(fb)],
      [t("= Precio FAS","= FAS price","= Preço FAS"),U(r.fas),1],
      [t("− Flete hasta el puerto","− Freight to port","− Frete até o porto"),"− "+U(fl)],
      [t("− Gastos de comercialización","− Commercial costs","− Gastos comerciais")+` (${fmt(co,1)}%)`,"− "+U(r.cm)],
      [t("= Precio en chacra","= Farm-gate price","= Preço na fazenda"),U(r.ch),1],
      [t("Valor en chacra de","Farm value of","Valor na fazenda de")+` ${fmt(tn)} t`,tc?"$ "+fmt(r.ch*tn*tc):U(r.ch*tn),1],
      [t("Derechos de exportación de la operación","Export duties paid on the deal","Retenções pagas na operação"),U(r.dx*tn)]
    ].map(s=>`<div class="sc${s[2]?" res":""}"><span>${s[0]}</span><span>${s[1]}</span></div>`).join("");
    $("cmp").innerHTML=GK.map(k=>{const g=PR.grains[k];if(!g.fob)return"";const c=compute(g.fob,g.dex||0,fb,fl,co),u=usdOf(k);
      return `<tr><td class="gr">${x(GN[k])}</td><td class="num">${fmt(g.fob,0)}</td><td class="num">${fmt(g.dex||0,1)}%</td><td class="num">${fmt(c.fas,2)}</td><td class="num">${fmt(c.ch,2)}</td><td class="num">${tc?"$ "+fmt(c.ch*tc):"–"}</td><td class="num">${u?fmt(u,2):"–"}</td></tr>`;}).join("");
  }
  $("cG").addEventListener("change",()=>{loadRef();calc();});
  ids.forEach(i=>$(i).addEventListener("input",calc));
  $("cR").addEventListener("click",()=>{CS={g:$("cG").value,fb:FOBBING,fl:20,co:2,t:1000};loadRef();setDefaults();calc();});
  loadRef();setDefaults();calc();
}
function hookGlos(){const q=document.getElementById("gq"),items=[...document.querySelectorAll("#gl .term")],em=document.getElementById("gEmpty");
  q.addEventListener("input",()=>{const v=q.value.trim().toLowerCase();let n=0;items.forEach(it=>{const s=!v||it.dataset.s.includes(v);it.hidden=!s;if(s)n++;});em.hidden=n>0;});}
function hookForm(){const f=document.getElementById("form");f.addEventListener("submit",e=>{e.preventDefault();
  const m=document.getElementById("fM"),ok=document.getElementById("fN").value.trim()&&m.value.trim()&&m.checkValidity()&&document.getElementById("fQ").value.trim();
  document.getElementById("fE").classList.toggle("show",!ok);document.getElementById("fO").classList.toggle("show",!!ok);if(ok)f.reset();});}

/* ================= ADMIN (runtime db) ================= */
let DB=null,USER=null,CAN_EDIT=false,adminDirty=false;
function adminHTML(){
  const inp=(id,v,step)=>`<input id="${id}" type="number" step="${step||"any"}" inputmode="decimal" value="${v===null||v===undefined?"":v}">`;
  return `<div class="admin"><h3>${t("Panel de actualización de precios","Price update panel","Painel de atualização de preços")}</h3>
  <p class="sub">${t("Visible únicamente para usuarios con permiso de edición. Los valores guardados se publican para todos los visitantes del sitio.","Only people with edit access see this. Whatever you save here is shown to every visitor.","Só quem tem permissão de edição vê este painel. O que você salvar aqui aparece para todos os visitantes.")}</p>
  <div class="admin-grid">
    <div class="field"><label for="aF">${t("Fecha de la pizarra","Spot price date","Data da pizarra")}</label><input id="aF" value="${esc(PR.fecha)}"></div>
    <div class="field"><label for="aTc">${t("Dólar BNA comprador","BNA USD buy rate","Dólar BNA comprador")}</label>${inp("aTc",PR.tc)}</div>
    <div class="field"><label for="aCf">${t("Fecha CBOT","CBOT date","Data CBOT")}</label><input id="aCf" value="${esc(PR.cbot.fecha)}"></div>
    <div class="field"><label for="aCs">CBOT ${x(GN.soja)}</label>${inp("aCs",PR.cbot.soja)}</div>
    <div class="field"><label for="aCm">CBOT ${x(GN.maiz)}</label>${inp("aCm",PR.cbot.maiz)}</div>
    <div class="field"><label for="aCt">CBOT ${x(GN.trigo)}</label>${inp("aCt",PR.cbot.trigo)}</div>
  </div>
  <div class="tbl" style="margin-top:8px"><table><thead><tr><th>${t("Grano","Crop","Grão")}</th><th>${t("Pizarra $/t","Spot $/t","Pizarra $/t")}</th><th>${t("Var. %","Change %","Var. %")}</th><th>FOB US$/t</th><th>DEX %</th></tr></thead><tbody>
  ${GK.map(k=>{const g=PR.grains[k];return `<tr><td class="gr">${x(GN[k])}</td><td>${inp("a_"+k+"_ars",g.ars)}</td><td>${inp("a_"+k+"_var",g.var)}</td><td>${inp("a_"+k+"_fob",g.fob)}</td><td>${inp("a_"+k+"_dex",g.dex)}</td></tr>`;}).join("")}
  </tbody></table></div>
  <p class="small-note">${t("Deje en blanco los campos sin cotización.","Leave blank anything without a quote.","Deixe em branco o que não tiver cotação.")}</p>
  <div class="ctas" style="margin-top:18px"><button class="btn" id="aSave" type="button">${t("Guardar precios","Save prices","Salvar preços")}</button></div>
  <p class="msg" id="aMsg" aria-live="polite"></p></div>`;
}
function hookAdmin(){
  const box=document.getElementById("adminBox");if(!box||!CAN_EDIT||!DB)return;
  box.innerHTML=adminHTML();adminDirty=false;
  box.querySelectorAll("input").forEach(i=>i.addEventListener("input",()=>{adminDirty=true;}));
  const v=id=>document.getElementById(id).value;
  document.getElementById("aSave").addEventListener("click",async e=>{
    const b=e.currentTarget,msg=document.getElementById("aMsg");b.disabled=true;msg.textContent="";
    const data={fecha:v("aF").trim().slice(0,20),tc:nOrNull(v("aTc")),cbot:{fecha:v("aCf").trim().slice(0,20),soja:nOrNull(v("aCs")),maiz:nOrNull(v("aCm")),trigo:nOrNull(v("aCt"))},grains:{}};
    GK.forEach(k=>{data.grains[k]={ars:nOrNull(v("a_"+k+"_ars")),var:nOrNull(v("a_"+k+"_var")),fob:nOrNull(v("a_"+k+"_fob")),dex:nOrNull(v("a_"+k+"_dex")),est:false,fobEst:false};});
    try{await DB.doc("data/precios").set(data);adminDirty=false;PR=normalize(data);fromTeam=true;render(false);
      const m2=document.getElementById("aMsg");if(m2){m2.style.color="#8FD1A8";m2.textContent=t("Precios guardados y publicados para todos los visitantes.","Prices saved. Every visitor now sees them.","Preços salvos. Todos os visitantes já os veem.");}
    }catch(err){b.disabled=false;msg.style.color="#F0AA90";msg.textContent=(err&&err.code==="invalid_argument")?t("Su usuario no tiene permiso para guardar precios.","Your account isn't allowed to save prices.","Sua conta não tem permissão para salvar preços."):t("No fue posible guardar los precios. Verifique su conexión e intente nuevamente.","Prices couldn't be saved. Check your connection and try again.","Não foi possível salvar os preços. Verifique sua conexão e tente de novo.");}
  });
}
async function initRuntime(){
  if(!window.claude||typeof window.claude.use!=="function")return;
  try{
    DB=await window.claude.use("db");USER=await window.claude.use("user");
    if(USER){try{CAN_EDIT=await USER.canEdit();}catch(e){CAN_EDIT=false;}}
    if(DB){DB.doc("data/precios").onSnapshot(s=>{
        if(s.exists){PR=normalize(s.data());fromTeam=true;}
        const r=route().p;if(!adminDirty&&(r==="inicio"||r==="precios"))render(false);
      },()=>{});}
    if(CAN_EDIT&&route().p==="precios")hookAdmin();
  }catch(e){}
}

/* ================= ROUTER ================= */
function route(){const h=location.hash.replace(/^#\/?/,"");const[p,a]=h.split("/");return{p:(PAGES[p]?p:"inicio"),a};}
const app=document.getElementById("app"),links=document.getElementById("links"),menuBtn=document.getElementById("menuBtn");
function renderShell(r){
  links.innerHTML=NAV.map(n=>`<a href="#/${n[0]}" class="${r.p===n[0]?"on":""}">${x(n[1])}</a>`).join("");
  document.getElementById("navCta").textContent=t("Contáctenos","Get in touch","Fale conosco");
  document.querySelectorAll(".langs button").forEach(b=>{b.classList.toggle("on",+b.dataset.l===LI);b.setAttribute("aria-pressed",+b.dataset.l===LI);});
  document.documentElement.lang=["es","en","pt"][LI];
  document.getElementById("foot").innerHTML=`<div class="wrap"><div class="foot">
    <div><a class="brand" href="#/inicio"><span class="brand-txt"><b>Pampa Grain</b><small>CONSULTING</small></span></a><p style="margin-top:16px;max-width:36ch">${t("Consultoría estratégica en comercio internacional de granos argentinos.","Strategic consulting in international trade of Argentine grain.","Consultoria estratégica em comércio internacional de grãos argentinos.")}</p></div>
    <div><h4>${t("Empresa","Company","Empresa")}</h4><ul>${NAV.slice(0,4).map(n=>`<li><a href="#/${n[0]}">${x(n[1])}</a></li>`).join("")}</ul></div>
    <div><h4>${t("Herramientas","Tools","Ferramentas")}</h4><ul>${NAV.slice(4).map(n=>`<li><a href="#/${n[0]}">${x(n[1])}</a></li>`).join("")}</ul></div>
    <div><h4>${t("Oficinas","Offices","Escritórios")}</h4><ul><li>Mendoza</li><li>Rosario</li><li>Córdoba</li><li>Santa Fe</li><li>Buenos Aires</li></ul></div>
  </div><div class="legal"><span>© 2026 Pampa Grain Consulting · www.pampagrainconsulting.com.ar</span><span>${t("Proyecto académico de Práctica Profesional, Licenciatura en Comercio Internacional, Universidad Champagnat.","Academic project for the Professional Practice course, BA in International Trade, Universidad Champagnat.","Projeto acadêmico de Prática Profissional, Bacharelado em Comércio Internacional, Universidad Champagnat.")}</span></div></div>`;
}
const TITLES={inicio:["Comercio internacional de granos","International grain trade","Comércio internacional de grãos"]};
function render(scrollTop){
  const r=route();renderShell(r);
  app.innerHTML=(r.p==="servicios"&&r.a)?serviceDetail(r.a):PAGES[r.p]();
  const nav=NAV.find(n=>n[0]===r.p);document.title="Pampa Grain Consulting | "+(nav?x(nav[1]):x(TITLES.inicio));
  DM=null;
  if(r.p==="inicio")hookHome();
  if(r.p==="mercado")hookMercado();
  if(r.p==="calculadora")hookCalc();
  if(r.p==="glosario")hookGlos();
  if(r.p==="contacto")hookForm();
  if(r.p==="precios")hookAdmin();
  links.classList.remove("open");menuBtn.setAttribute("aria-expanded","false");
  if(scrollTop)window.scrollTo(0,0);
}
window.addEventListener("hashchange",()=>render(true));
menuBtn.addEventListener("click",()=>{const o=links.classList.toggle("open");menuBtn.setAttribute("aria-expanded",o);});
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>{LI=+b.dataset.l;try{localStorage.setItem("pgc-lang",String(LI));}catch(e){}render(false);}));
render(true);
initRuntime();
})();
</script>
